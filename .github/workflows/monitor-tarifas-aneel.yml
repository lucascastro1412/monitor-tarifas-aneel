name: Monitor Tarifas ANEEL (B3, Fio B SCEE e Grupo A)

# A coleta na ANEEL roda no PC do usuario (rodar_local.ps1, IP brasileiro): o portal
# dadosabertos.aneel.gov.br recusa os runners do GitHub Actions (SSLEOFError no package_show).
# O rodar_local.ps1 faz commit e push de data/ e dos paineis; esse push dispara este workflow,
# que so monta o site com o que esta commitado e publica no GitHub Pages (index.html + Excel).
#
# Coleta no Actions: DESLIGADA por padrao. So roda em:
#   - Run workflow (workflow_dispatch) com "coletar" marcado (padrao: desmarcado); ou
#   - Run workflow com a variavel do repositorio MODO_COLETA = "actions"
#     (Settings > Secrets and variables > Actions > Variables).
# Push nunca coleta (evita laco com o rodar_local.ps1).
#
# Sem cron: com a coleta no PC, uma execucao agendada so republicaria o mesmo painel que o push
# ja publicou. Para voltar a coletar todo dia no Actions (se a ANEEL liberar os runners), defina
# MODO_COLETA = "actions" e reative o bloco "schedule" abaixo; o COLETAR ja trata o evento schedule.
#
# Quando a coleta roda no Actions e detecta nova homologacao (REH/Despacho) ou valor alterado:
#   - atualiza data/*.csv e os paineis Painel_Tarifas_ANEEL.xlsx e .html (commit automatico)
#   - abre uma Issue com o resumo (o GitHub envia por e-mail a quem acompanha o repo)
# Se a coleta falhar, o painel ja commitado ainda e publicado; o job termina como falha no fim
# (para o GitHub avisar por e-mail), mas o deploy do Pages nao depende do sucesso da coleta.

on:
  # schedule:
  #   - cron: "0 10 * * *"  # 07:00 em Brasilia (UTC-3); so coleta se MODO_COLETA = "actions"
  push:
    branches: [main]
    # Push que mude so data/ ou os paineis (o caso do rodar_local.ps1) republica o Pages.
    paths:
      - "Painel_Tarifas_ANEEL.html"
      - "Painel_Tarifas_ANEEL.xlsx"
      - "data/**"
  workflow_dispatch:
    inputs:
      coletar:
        description: "Coletar na ANEEL (a ANEEL costuma recusar o runner; deixe desmarcado para so republicar o painel commitado)"
        type: boolean
        default: false
      forcar_painel:
        description: "Regerar os paineis Excel e HTML mesmo sem mudancas (so com coleta)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: monitor-tarifas-aneel
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tem_painel: ${{ steps.site.outputs.tem_painel }}
    env:
      # Coleta so em Run workflow com "coletar" marcado, ou com MODO_COLETA = "actions" (Run workflow
      # ou schedule, se reativado). Push nunca coleta.
      COLETAR: ${{ (github.event_name == 'workflow_dispatch' && (inputs.coletar || vars.MODO_COLETA == 'actions')) || (github.event_name == 'schedule' && vars.MODO_COLETA == 'actions') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Modo de execucao
        run: |
          echo "Evento: ${{ github.event_name }} | MODO_COLETA: ${{ vars.MODO_COLETA || '(nao definida)' }} | coletar: $COLETAR"
          if [ "$COLETAR" != "true" ]; then
            echo "::notice title=Sem coleta::So publica o painel commitado (coleta no PC via rodar_local.ps1)."
          fi

      - name: Setup Python
        if: env.COLETAR == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        if: env.COLETAR == 'true'
        run: pip install -r requirements.txt

      - name: Executar monitor
        id: monitor
        if: env.COLETAR == 'true'
        continue-on-error: true
        env:
          PAINEL_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "${{ inputs.forcar_painel }}" = "true" ]; then
            python monitor_tarifas.py --forcar-painel
          else
            python monitor_tarifas.py
          fi

      - name: Salvar dados e painel (commit)
        if: steps.monitor.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add -A data
          for f in Painel_Tarifas_ANEEL.xlsx Painel_Tarifas_ANEEL.html; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "Monitor tarifas ANEEL: atualizacao $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      - name: Abrir alerta (Issue)
        if: steps.monitor.outcome == 'success' && steps.monitor.outputs.alerta == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create tarifa-aneel --color FBCA04 --description "Alertas do monitor de tarifas ANEEL" --force
          TITULO="$(head -n1 alerta.md | sed 's/^# //')"
          gh issue create --title "$TITULO" --body-file alerta.md --label tarifa-aneel

      # Site do GitHub Pages: montado em toda execucao, mesmo sem mudancas ou com a coleta falha,
      # a partir do painel no disco (o recem-gerado ou o ultimo commitado).
      - name: Montar site (GitHub Pages)
        id: site
        if: always()
        run: |
          rm -rf site
          if [ -e Painel_Tarifas_ANEEL.html ]; then
            mkdir -p site
            cp Painel_Tarifas_ANEEL.html site/index.html
            if [ -e Painel_Tarifas_ANEEL.xlsx ]; then cp Painel_Tarifas_ANEEL.xlsx site/; fi
            ls -la site
            echo "tem_painel=true" >> "$GITHUB_OUTPUT"
          else
            echo "Painel nao encontrado; nada a publicar no Pages."
            echo "tem_painel=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Pages
        if: always() && steps.site.outputs.tem_painel == 'true'
        uses: actions/configure-pages@v5

      - name: Enviar site (artifact do Pages)
        if: always() && steps.site.outputs.tem_painel == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar painel (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: painel-tarifas-aneel
          path: |
            Painel_Tarifas_ANEEL.xlsx
            Painel_Tarifas_ANEEL.html
          if-no-files-found: ignore

      # Por ultimo: marca o job como falho se a coleta falhou (o GitHub avisa por e-mail), depois de o
      # painel existente ja ter sido enviado ao Pages.
      - name: Resultado da coleta
        if: always() && steps.monitor.outcome == 'failure'
        run: |
          echo "::error title=Coleta ANEEL falhou::Painel commitado foi publicado mesmo assim. Veja o log de 'Executar monitor'. Se a ANEEL recusou o runner, colete no PC com rodar_local.ps1 (README)."
          exit 1

  deploy:
    needs: monitorar
    # always(): publica mesmo que a coleta tenha falhado, desde que haja painel.
    if: always() && needs.monitorar.outputs.tem_painel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
